<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Remain</title>
  <base href="/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the theme picked in the nav menu before anything paints (see app/theme/theme.ts).
    try {
      var theme = localStorage.getItem('remain-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
    rel="stylesheet">
</head>

<body class="bg-app-bg">
  <app-root></app-root>
</body>

</html>
