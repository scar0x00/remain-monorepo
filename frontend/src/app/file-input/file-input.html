<input
  #fileInput
  type="file"
  class="hidden"
  [accept]="accept()"
  [multiple]="multiple()"
  (change)="onChange($event)"
/>
<button
  type="button"
  (click)="open()"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  [title]="label()"
  class="inline-flex items-center justify-center gap-2 size-11 sm:size-auto sm:px-3 sm:py-2 rounded-xl border border-app-border text-app-text hover:cursor-pointer hover:bg-app-card-hover disabled:opacity-50 disabled:cursor-not-allowed"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="lucide lucide-paperclip-icon lucide-paperclip"
  >
    <path
      d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"
    />
  </svg>
  <span class="hidden sm:inline text-sm">{{ label() }}</span>
</button>
