<div class="relative mb-6">
    <label for="deck-search" class="block">
      <span class="sr-only">Search decks</span>
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-app-text-subtle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input [(ngModel)]="searchValue" (input)="handleInput($event)" id="deck-search" type="text" placeholder="Search decks" class="w-full text-app-text bg-app-card shadow-inset border-2 border-app-border rounded-lg py-2.5 pl-10 pr-11 placeholder:text-app-text-subtle focus:outline-none focus:border-action focus:ring-4 focus:ring-action/20" />
    </label>
    <!-- The clear button sits inside the field, where the text it clears is. -->
    <svg (click)="handleClear()" xmlns="http://www.w3.org/2000/svg" class="absolute right-2 top-1/2 -translate-y-1/2 cursor-pointer rounded-full p-1 text-app-text-subtle hover:bg-app-card-hover hover:text-app-text size-7 lucide lucide-x-icon lucide-x" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
</div>
