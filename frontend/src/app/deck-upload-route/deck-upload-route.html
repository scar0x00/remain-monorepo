<form class="text-app-text flex flex-col justify-start items-center space-y-4" method="post"
  enctype="multipart/form-data">
  <div class="">
    <label for="deck-file" class="flex flex-col justify-center items-center gap-3">
      <h1 class="font-bold text-2xl">
        Upload your deck(s)
      </h1>
      <input class="w-[60vw] bg-primary px-3 py-2 text-center hover:cursor-pointer rounded-lg text-sm" type="file" id="deck-file" name="deck-file" accept=".json" multiple />
    </label>
  </div>
  <div>
    <button class="text-app-text-muted text-lg bg-app-card px-3 py-2 rounded-lg hover:cursor-pointer">Submit</button>
  </div>
</form>
