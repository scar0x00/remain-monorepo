@if (searchTerm.deck.value()) {
    <div class="text-app-text-muted">
        <ul class="flex flex-col justify-start items-start gap-y-2">
            @for (deck of searchTerm.deck.value(); track deck.etag) {
                <li class="grid grid-cols-2 gap-4 w-full border-b border-b-app-border py-3">
                    <div class="text-lg text-nowrap text-ellipsis font-medium">
                        <a [routerLink]="['/deck-study/', getDeckPath(deck.deckName)]">
                            {{ deck.deckName.replace(/\.json$/i, "") }}
                        </a>
                    </div>
                    <div class="flex justify-end items-center gap-4">
                        <span class="text-xs font-mono text-nowrap">{{ convertToDate(deck.uploaded) | date:'dd-MM-yyyy' }}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-notebook-pen-icon lucide-notebook-pen"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download-icon lucide-download"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
                    </div>
                </li>
            }
        </ul>
    </div>
} @else {
    <div class="grid place-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="animate-spin lucide lucide-loader-circle-icon lucide-loader-circle">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
    </div>
}
