<nav class="px-4 py-4 sm:px-6">
    <ul class="flex justify-end items-center text-app-text-subtle gap-6 *:hover:cursor-pointer">
        <li>
            <button type="button" popovertarget="nav-menu" aria-label="Open menu" class="-m-1 grid place-items-center p-1 cursor-pointer hover:text-app-text">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
            </button>
            <div #menu id="nav-menu" popover aria-label="Menu"
                class="m-0 mt-16 ml-4 sm:ml-6 min-w-56 rounded-xl bg-app-card p-2 text-app-text shadow-e4">
                <ul class="flex flex-col">
                    @for (item of menuItems; track item.path) {
                        <li>
                            <a [routerLink]="item.path" routerLinkActive="bg-app-card font-semibold !text-app-text" ariaCurrentWhenActive="page"
                                class="flex min-h-11 items-center gap-3 rounded-xl px-3 text-app-text-muted hover:bg-app-card hover:text-app-text"
                                (click)="closeMenu()">{{ item.label }}</a>
                        </li>
                    }
                </ul>
                <div class="mt-2 border-t border-app-border px-1 pt-2 pb-1">
                    <p id="theme-label" class="px-2 pb-2 text-sm text-app-text-subtle">Theme</p>
                    <div role="radiogroup" aria-labelledby="theme-label" class="grid grid-cols-3 gap-1 rounded-xl bg-app-bg p-1">
                        @for (option of themeOptions; track option.value) {
                            <label
                                class="flex min-h-11 cursor-pointer flex-col items-center justify-center gap-0.5 rounded-lg py-1.5 text-xs text-app-text-muted hover:text-app-text has-[:checked]:bg-app-card has-[:checked]:font-semibold has-[:checked]:text-app-text has-[:checked]:shadow-e1 has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-app-text">
                                <input type="radio" name="theme" class="sr-only" [value]="option.value"
                                    [checked]="theme.preference() === option.value" (change)="theme.set(option.value)">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    @switch (option.value) {
                                        @case ('system') { <rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/> }
                                        @case ('light') { <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/> }
                                        @case ('dark') { <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/> }
                                    }
                                </svg>
                                {{ option.label }}
                            </label>
                        }
                    </div>
                </div>
                <div class="mt-2 border-t border-app-border pt-2">
                    @if (auth.user(); as user) {
                        <p class="flex flex-col px-3 py-2 text-sm">
                            <span class="font-semibold">{{ user.name }}</span>
                            <span class="truncate text-app-text-subtle">{{ user.email }}</span>
                        </p>
                        <a routerLink="/settings/security" (click)="closeMenu()"
                            class="flex min-h-11 items-center rounded-xl px-3 text-app-text-muted hover:bg-app-card-hover hover:text-app-text">Security</a>
                        <button type="button" (click)="signOut()"
                            class="flex min-h-11 w-full items-center rounded-xl px-3 text-left text-app-text-muted hover:bg-app-card-hover hover:text-app-text hover:cursor-pointer">Sign out</button>
                    } @else {
                        <a routerLink="/login" (click)="closeMenu()"
                            class="flex min-h-11 items-center rounded-xl px-3 font-semibold text-app-text hover:bg-app-card-hover">Sign in</a>
                    }
                </div>
            </div>
        </li>
        <!-- Says where you are on every page: the favicon's two cards drawn at their own size, plus the name. -->
        <li class="mr-auto -ml-2">
            <a routerLink="/" aria-label="Remain home" class="flex items-center gap-2 font-bold tracking-tight text-app-text">
                <img src="favicon.svg" alt="" width="24" height="24" class="size-6" />
                <span class="max-sm:sr-only">Remain</span>
            </a>
        </li>
        <!-- Shortcuts only once signed in: signed out they would only bounce to the sign-in page. -->
        @if (auth.user()) {
        <li>
            <a routerLink="/deck-browse" routerLinkActive="text-app-text" aria-label="Browse decks" title="Browse decks" class="hover:text-app-text">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6 lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            </a>
        </li>
        <li>
            <a routerLink="/flashcard-chat" routerLinkActive="text-app-text" aria-label="Create a deck" title="Create a deck" class="hover:text-app-text">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6 lucide lucide-sparkles-icon lucide-sparkles"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
            </a>
        </li>
        <li>
            <a routerLink="/deck-upload" routerLinkActive="text-app-text" aria-label="Upload a deck" title="Upload a deck" class="hover:text-app-text">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6 lucide lucide-cloud-upload-icon lucide-cloud-upload"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
            </a>
        </li>
        }
    </ul>
</nav>
