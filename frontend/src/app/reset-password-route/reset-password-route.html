@if (done()) {
    <app-auth-card heading="Password changed" subheading="You’ve been signed out everywhere. Sign in with your new password.">
        <a routerLink="/login" class="min-h-11 rounded-full bg-action px-5 font-bold text-app-bg shadow-raised hover:bg-action-hover hover:cursor-pointer disabled:opacity-60 flex items-center justify-center">Sign in</a>
    </app-auth-card>
} @else if (error() || !token()) {
    <app-auth-card heading="This link didn’t work" subheading="Reset links expire after one hour and work once.">
        <a routerLink="/forgot-password" class="min-h-11 rounded-full bg-action px-5 font-bold text-app-bg shadow-raised hover:bg-action-hover hover:cursor-pointer disabled:opacity-60 flex items-center justify-center">Get a new link</a>
    </app-auth-card>
} @else {
    <app-auth-card heading="Choose a new password">
        <form class="flex flex-col gap-4" (submit)="submit($event)">
            <div class="flex flex-col gap-2">
                <label for="reset-password" class="text-sm font-semibold text-app-text-muted">New password <span class="font-normal text-app-text-subtle">· at least 10 characters</span></label>
                <input id="reset-password" type="password" name="password" autocomplete="new-password" required minlength="10" class="rounded-lg border-2 border-app-border bg-app-bg px-3 py-2 text-app-text shadow-inset placeholder:text-app-text-subtle focus:border-action focus:outline-none"
                    [value]="password()" (input)="password.set($any($event.target).value)" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="reset-confirm" class="text-sm font-semibold text-app-text-muted">Repeat it</label>
                <input id="reset-confirm" type="password" name="confirm" autocomplete="new-password" required minlength="10" class="rounded-lg border-2 border-app-border bg-app-bg px-3 py-2 text-app-text shadow-inset placeholder:text-app-text-subtle focus:border-action focus:outline-none"
                    [value]="confirm()" (input)="confirm.set($any($event.target).value)" />
            </div>
            @if (failure(); as failure) {
                <p role="alert" class="text-sm text-accent">{{ failure.message }}</p>
            }
            <button type="submit" [disabled]="busy()" class="min-h-11 rounded-full bg-action px-5 font-bold text-app-bg shadow-raised hover:bg-action-hover hover:cursor-pointer disabled:opacity-60">Change password</button>
        </form>
    </app-auth-card>
}
