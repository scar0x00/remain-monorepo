<label class="flex items-center gap-2 text-sm text-app-text-muted">
    <span class="shrink-0">Sort by</span>
    <!-- Native arrow replaced by our own so it gets the same padding as the text. -->
    <span class="relative inline-flex w-full sm:w-auto">
        <select id="deck-sort"
            class="w-full appearance-none cursor-pointer rounded-lg border-2 border-app-border bg-app-card py-2.5 pl-3 pr-9 text-base text-app-text shadow-inset focus:border-action focus:outline-none focus:ring-4 focus:ring-action/20"
            (change)="select($any($event.target).value)">
            @for (option of options; track $index) {
                <option [value]="$index" [selected]="$index === selected()">{{ option.label }}</option>
            }
        </select>
        <svg aria-hidden="true" class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-app-text-subtle"
            width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </span>
</label>
