@if (sent()) {
    <app-auth-card heading="Check your inbox">
        <p class="leading-relaxed text-app-text-muted">If <strong class="text-app-text">{{ email() }}</strong> has a Remain account, a link to choose a new password is on its way. It expires in one hour.</p>
        <a routerLink="/login" class="text-center text-sm font-semibold text-app-text hover:underline">Back to sign in</a>
    </app-auth-card>
} @else {
    <app-auth-card heading="Reset your password" subheading="We’ll email you a link to choose a new one.">
        <form class="flex flex-col gap-4" (submit)="submit($event)">
            <div class="flex flex-col gap-2">
                <label for="forgot-email" class="text-sm font-semibold text-app-text-muted">Email</label>
                <input id="forgot-email" type="email" name="email" autocomplete="email" required class="rounded-lg border-2 border-app-border bg-app-bg px-3 py-2 text-app-text shadow-inset placeholder:text-app-text-subtle focus:border-action focus:outline-none"
                    [value]="email()" (input)="email.set($any($event.target).value)" />
            </div>
            @if (failure(); as failure) {
                <p role="alert" class="text-sm text-accent">{{ failure.message }}</p>
            }
            <button type="submit" [disabled]="busy()" class="min-h-11 rounded-full bg-action px-5 font-bold text-app-bg shadow-raised hover:bg-action-hover hover:cursor-pointer disabled:opacity-60">Email me a link</button>
        </form>
        <p footer class="text-center text-sm text-app-text-muted"><a routerLink="/login" class="font-semibold text-app-text hover:underline">Back to sign in</a></p>
    </app-auth-card>
}
