name: Tests

# Runs every test suite in the repo: unit tests of each package, main-backend's API e2e,
# the agent's live smoke test and the browser e2e against the whole local stack.
# Run it by hand with Actions > Tests > Run workflow.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Local Postgres (the service container below) stands in for Hyperdrive in `wrangler dev`.
  # wrangler rejects a connection string without a password.
  CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_PG: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  agent-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashcard-generator-agent
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-backend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # The Angular CLI runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test --watch=false

  # Starts its own `wrangler dev`; R2 is local and Postgres is the service container,
  # so it needs no Cloudflare credentials.
  backend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: main-backend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: ../scripts/ci-migrate.sh
      # bun's default 5s hook timeout is shorter than a cold `wrangler dev` start.
      - run: bun run test:e2e --timeout 120000

  # The agent's AI binding always runs remotely, so `wrangler dev` needs Cloudflare credentials.
  # SMOKE_LIVE=1 also runs the generation tests, which call the real model.
  agent-smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_LIVE: "1"
    defaults:
      run:
        working-directory: flashcard-generator-agent
    steps:
      - uses: actions/checkout@v7
      - name: Check Cloudflare secrets
        run: ../scripts/ci-require-cloudflare.sh
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:smoke --timeout 300000

  # Browser e2e against the whole stack (frontend 4200 -> main-backend 8787 -> agent 8788),
  # started with ./dev-server like on a laptop. Generates a deck, so it calls the real model too.
  e2e:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Check Cloudflare secrets
        run: scripts/ci-require-cloudflare.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install packages
        run: |
          (cd flashcard-generator-agent && bun install --frozen-lockfile)
          (cd main-backend && bun install --frozen-lockfile)
          (cd frontend && bun install)
          (cd e2e && bun install --frozen-lockfile)
      - name: Apply migrations
        working-directory: main-backend
        run: ../scripts/ci-migrate.sh
      - name: Start the stack
        run: |
          ./dev-server start
          # Any answer from the agent means it is up; the deck list has to succeed through the
          # frontend's proxy, which needs both the frontend and main-backend.
          timeout 300 bash -c 'until curl -s -o /dev/null http://localhost:8788; do sleep 2; done' \
            && timeout 300 bash -c 'until curl -sf -o /dev/null http://localhost:4200/api/v1/decks; do sleep 2; done' \
            || { echo "The stack did not come up"; tail -n 100 "${TMPDIR:-/tmp/opencode}"/dev-server/*.log; exit 1; }
      # Uses the Google Chrome that ships on ubuntu-latest (playwright-core, channel "chrome").
      - name: Run browser e2e
        working-directory: e2e
        run: bun run test --timeout 60000
      - name: Dev server logs
        if: failure()
        run: tail -n 200 "${TMPDIR:-/tmp/opencode}"/dev-server/*.log
      - name: Stop the stack
        if: always()
        run: ./dev-server stop
